name: Build MovitTop Android 4.4.4 API19

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct API19 project from bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source-api19-lines.b64 ]; then
            tr -d '\n\r' < source-api19-lines.b64 | base64 --decode > /tmp/source-api19.tar.xz
            rm -rf /tmp/source-api19
            mkdir -p /tmp/source-api19
            tar -xJf /tmp/source-api19.tar.xz -C /tmp/source-api19
            cp -a /tmp/source-api19/root/. .
            rm -f source-api19-lines.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Sync Android 4.4.4 API19 source [skip ci]"
              git push
            fi
          fi
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovitTop-Android4.4.4-API19-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
